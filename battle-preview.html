<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おかえりの灯 — 戦闘のおためし</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="battle.css"></head><body><main><header class="masthead"><div class="brand">おかえりの灯 <span class="edition">戦闘のおためし</span></div><nav><button id="normal">こごえモチ</button><button id="boss">枝角の番人</button></nav></header><section id="stage" style="background:url('assets/cover.png') center/cover"><section id="battleScreen" aria-label="戦闘"></section></section><footer id="controls">この画面は戦闘だけのおためしです。本編のセーブには影響しません。<a href="index.html" style="color:#efd6a0">本編へ</a></footer></main><script src="core.js"></script><script src="assets/cast-data.js"></script><script src="cast.js"></script><script src="world.js"></script><script src="battle-ui.js"></script><script>
let battle,kind='mochi';const ui=new OkaeriBattle.BattleUI(document.getElementById('battleScreen'),{onTurn:(commands,team)=>{battle=OkaeriCore.resolveTurn(battle,team?{team:'flare'}:commands,['touma','nina']);ui.showResult(battle);},onVictory:()=>begin(kind),onRetry:()=>begin(kind),onEscape:()=>begin(kind)});function begin(k){kind=k;battle=OkaeriCore.newBattle(k);ui.begin(battle);}document.getElementById('normal').onclick=()=>begin('mochi');document.getElementById('boss').onclick=()=>begin('guardian');document.addEventListener('keydown',e=>ui.key(e));OkaeriCast.ready.then(()=>begin('mochi'));
</script></body></html>
