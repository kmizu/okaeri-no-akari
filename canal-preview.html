<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共同水路 — おかえりの灯</title>
<style>body{margin:0;background:#203c49;color:#f2ebd9;font:16px system-ui;text-align:center}header{padding:16px}h1{font-size:22px;margin:0 0 8px}p{margin:6px}canvas{max-width:100%;max-height:76vh;object-fit:contain}a,button{color:#f2ebd9}button{background:#405f67;border:1px solid #b4c8c5;padding:8px 18px;border-radius:8px;margin:8px;cursor:pointer}</style>
<header><h1>第二話「水音の帰る道」</h1><p>共同水路の風景プレビュー · セーブデータは変更しません</p><button id="before">修理前</button><button id="after">灯りが戻った水路</button><a href="index.html">本編へ</a></header><canvas id="world" width="1152" height="768"></canvas>
<script src="story.js"></script><script src="assets/walk-data.js"></script><script src="sprites.js"></script><script src="assets/cast-data.js"></script><script src="cast.js"></script><script src="world.js"></script>
<script>const s={scene:'canal',x:6,y:10,lead:'touma',flags:{}},r=new OkaeriWorld.Renderer(document.getElementById('world'));r.reset(s);document.getElementById('before').onclick=()=>s.flags={};document.getElementById('after').onclick=()=>s.flags={waterGate:true,canalCrab:true,waterFlow:true,waterLit:true};Promise.all([OkaeriSprites.load(),OkaeriCast.ready]).then(()=>requestAnimationFrame(function draw(t){r.draw(s,t,'explore');requestAnimationFrame(draw);}));</script></html>
