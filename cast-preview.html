<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おかえりの灯 — 町の住人と森の精霊</title><link rel="stylesheet" href="style.css"><style>.cast-gallery{max-width:1120px;margin:30px auto;padding:25px;display:grid;grid-template-columns:repeat(5,1fr);gap:22px;background:linear-gradient(#c1d6dc,#e7eee3);border-radius:12px}.cast-item{color:#304a50;text-align:center;font-size:14px}.cast-item img{display:block;width:100%;height:240px;object-fit:contain;margin:15px 0;filter:drop-shadow(0 8px 4px #46617344)}.cast-item p{font-size:11px;line-height:1.7}.cast-note{max-width:1080px;margin:20px auto;color:#c6d3d2;font-size:13px;line-height:2;padding:0 20px}@media(max-width:800px){.cast-gallery{grid-template-columns:repeat(3,1fr);margin:15px}.cast-item img{height:180px}}</style></head><body><header class="masthead"><div class="brand">おかえりの灯 <span class="edition">町の住人と森の精霊</span></div></header><div id="cast" class="cast-gallery" aria-live="polite">画像を読み込んでいます…</div><p class="cast-note">トウマとニナに合わせ、冬服や道具、素材の質感を描き込みました。敵は探索と戦闘で同じ画像を使います。<br><a style="color:#e9be78" href="index.html">本編で見る</a>　／　<a style="color:#e9be78" href="battle-preview.html">戦闘で見る</a></p><script src="assets/cast-data.js"></script><script src="cast.js"></script><script>OkaeriCast.ready.then(()=>{document.getElementById('cast').innerHTML=[['sae','灯守のサエ','灯守の道具と、帰りを待つランタン。'],['maro','パン職人マロ','防寒着にエプロン、焼きたてのパン。'],['mochi','こごえモチ','雪のかたまりから生まれた、小さな精霊。'],['crab','こおりヤドカリ','古いカップが家。取っ手まで氷の結晶。'],['guardian','枝角の番人','木の角に鳥の巣を守る、森の守り手。']].map(([id,name,desc])=>'<div class="cast-item">'+OkaeriCast.battleArt(id)+'<strong>'+name+'</strong><p>'+desc+'</p></div>').join('');}).catch(()=>document.getElementById('cast').textContent='画像を読み込めませんでした。再読み込みしてください。');</script></body></html>
