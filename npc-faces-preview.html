<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>町で待つ人たち — おかえりの灯</title><link rel="stylesheet" href="style.css">
<style>body{padding:32px 20px}main{max-width:860px;margin:auto}h1{font-size:28px;margin:8px 0}p{color:#becdcb;line-height:1.8}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}.card{border:1px solid #ffffff24;border-radius:16px;padding:24px;background:#ffffff05}.faces{display:flex;gap:16px;justify-content:center}.faces .portrait{display:block;width:160px;height:160px;flex:0 0 160px;max-width:100%}figcaption{text-align:center;color:#becdcb;font-size:13px;margin-top:8px}figure{margin:0}h2{font-size:19px}a{color:#e9be78}@media(max-width:760px){.cards{grid-template-columns:1fr}.faces .portrait{width:125px;height:125px;flex-basis:125px}}.card canvas{position:static;inset:auto;display:block;width:100px;height:110px;margin:8px auto;object-fit:contain}</style>
<main><p>おかえりの灯 · 会話用フェイス</p><h1>町で待つ人たち</h1><p>旅立つ二人を見送り、帰ってきた二人を迎える顔。</p><div class="cards">
<section class="card"><h2>サエ / 灯守の師匠</h2><div class="faces"><figure><div class="portrait sae" role="img" aria-label="サエの通常の表情"></div><figcaption>見守る顔</figcaption></figure><figure><div class="portrait sae happy" role="img" aria-label="サエの笑顔"></div><figcaption>おかえりの笑顔</figcaption></figure></div><p>「よく帰ってきたね。さあ、温かいうちに食べておいで。」</p></section>
<section class="card"><h2>マロ / 町のパン屋</h2><div class="faces"><figure><div class="portrait maro" role="img" aria-label="マロの通常の表情"></div><figcaption>話を聞く顔</figcaption></figure><figure><div class="portrait maro happy" role="img" aria-label="マロの笑顔"></div><figcaption>迎える笑顔</figcaption></figure></div><p>「仕事の分じゃないよ。それは、おかえりの分。」</p></section><section class="card"><h2>エルナ / 織り手</h2><div class="faces"><figure><div class="portrait elna" role="img" aria-label="エルナの通常の表情"></div><figcaption>通常</figcaption></figure><figure><div class="portrait elna happy" role="img" aria-label="エルナの笑顔"></div><figcaption>笑顔</figcaption></figure></div><p>「ほどけたら、またおいで。何度でも結び直せるから。」</p><canvas id="elna-chip" width="100" height="110" aria-label="エルナのキャラチップ"></canvas></section><section class="card"><h2>オルフ / 配達人</h2><div class="faces"><figure><div class="portrait orlf" role="img" aria-label="オルフの通常の表情"></div><figcaption>通常</figcaption></figure><figure><div class="portrait orlf happy" role="img" aria-label="オルフの笑顔"></div><figcaption>笑顔</figcaption></figure></div><p>「帰り道まで、こっちもうれしくなった。」</p><canvas id="orlf-chip" width="100" height="110" aria-label="オルフのキャラチップ"></canvas></section></div><a href="index.html">本編へ戻る</a></main><script src="assets/residents-data.js"></script><script src="residents-art.js"></script><script>OkaeriResidentsArt.ready.then(()=>{for(const id of ["elna","orlf"]){const c=document.getElementById(id+"-chip").getContext("2d");OkaeriResidentsArt.drawMap(c,id,50,90);}});</script></html>
