<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雪の町の奥行き — おかえりの灯</title>
<style>body{margin:0;background:#122936;color:#eceddf;font:15px system-ui;text-align:center}header{padding:14px}h1{font-size:22px;margin:0 0 9px}button,a{font:inherit;color:#eceddf}button{padding:7px 20px;margin:3px;border:1px solid #819aa066;border-radius:8px;background:#ffffff09;cursor:pointer}button[aria-pressed=true]{background:#46616a;border-color:#e3c487}canvas{display:block;width:min(100%,1000px);height:auto;max-height:80vh;object-fit:contain;margin:auto}a{margin-left:15px}</style>
<header><h1>雪の町に、奥行きを</h1><button data-scene="town" aria-pressed="true">ユキネ</button><button data-scene="forest" aria-pressed="false">森</button><button data-scene="canal" aria-pressed="false">水路</button><button data-scene="hill" aria-pressed="false">丘</button><button data-scene="house" aria-pressed="false">二人の家</button><a href="index.html">本編へ</a></header><canvas id="world" width="1152" height="768" aria-label="背景のプレビュー。セーブデータは変更しません"></canvas>
<script src="story.js"></script><script src="assets/walk-data.js"></script><script src="sprites.js"></script><script src="assets/cast-data.js"></script><script src="cast.js"></script><script src="assets/residents-data.js"></script><script src="residents-art.js"></script><script src="world.js"></script>
<script>const s={scene:'town',x:12,y:10,lead:'touma',flags:{}},r=new OkaeriWorld.Renderer(document.getElementById('world'));r.reset(s);for(const btn of document.querySelectorAll('button'))btn.onclick=()=>{s.scene=btn.dataset.scene;[s.x,s.y]=s.scene==='house'?[12,12]:s.scene==='town'?[12,10]:s.scene==='forest'?[5,12]:s.scene==='canal'?[3,12]:[4,13];r.reset(s);for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===btn));};Promise.all([OkaeriSprites.load(),OkaeriCast.ready,OkaeriResidentsArt.ready]).then(()=>requestAnimationFrame(function draw(t){r.draw(s,t,'explore');requestAnimationFrame(draw);}));</script></html>
